repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Run tools from the project's locked environment so hook and CI versions never drift.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (banking-ledger-api)
        entry: uv run --project banking-ledger-api ruff check --fix
        language: system
        types: [python]
        files: ^banking-ledger-api/
      - id: ruff-format
        name: ruff format (banking-ledger-api)
        entry: uv run --project banking-ledger-api ruff format
        language: system
        types: [python]
        files: ^banking-ledger-api/
      - id: mypy
        name: mypy (banking-ledger-api)
        entry: bash -c 'cd banking-ledger-api && uv run mypy'
        language: system
        types: [python]
        files: ^banking-ledger-api/
        pass_filenames: false
