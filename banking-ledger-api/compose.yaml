name: banking-ledger

# The app reaches PostgreSQL by its service name. Credentials come from .env (single source);
# a password containing URL-reserved characters (@ : / ?) would need percent-encoding here.
x-database-url: &database-url
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted at the parent directory (not .../data).
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: applies migrations, then exits. Never done at API startup, where several
  # workers or replicas would race to migrate the same database.
  migrate:
    image: banking-ledger-api:dev
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-url
      APP_ENV: ${APP_ENV:-development}
    volumes:
      # Edited migrations apply without rebuilding the image.
      - ./migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: banking-ledger-api:dev
    build:
      context: .
      target: runtime
    environment:
      <<: *database-url
      APP_ENV: ${APP_ENV:-development}
      # Mounted source shadows the installed package so --reload picks up edits.
      PYTHONPATH: /app/src
    command:
      - uvicorn
      - ledger_api.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/src
    volumes:
      - ./src:/app/src:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
