name: banking-ledger

# Three roles, three URLs (ADR 0015), each given only to the service that needs it:
# - admin (POSTGRES_USER, the bootstrap superuser): the db itself and the one-shot bootstrap;
# - ledger_owner: owns every object, runs the migrations;
# - ledger_app: the API's only identity (a member of ledger_runtime, migration 0013's grants).
# Start order: db healthy -> bootstrap -> migrate -> api (with redis healthy). Passwords come
# from .env and are written into URLs unescaped: use letters, digits and . _ ~ - only.
x-admin-database-url: &admin-database-url
  ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
x-owner-database-url: &owner-database-url
  DATABASE_URL: postgresql+asyncpg://ledger_owner:${LEDGER_OWNER_PASSWORD:?set LEDGER_OWNER_PASSWORD in .env}@db:5432/${POSTGRES_DB}
x-app-database-url: &app-database-url
  DATABASE_URL: postgresql+asyncpg://ledger_app:${LEDGER_APP_PASSWORD:?set LEDGER_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted at the parent directory (not .../data).
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Rate-limit counters only (ADR 0008, ADR 0016): nothing else is ever stored here. No
  # persistence (counters are short-lived by design, and a restart only resets them), memory
  # capped with eviction of the keys closest to expiry, and no host port: only the api reaches
  # it, on the compose network.
  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, as the admin: creates or reconciles ledger_owner, ledger_runtime and ledger_app,
  # restricts the database, and on an existing volume transfers the objects to ledger_owner
  # (python -m ledger_api.admin.bootstrap, idempotent). The only service with the admin URL.
  bootstrap:
    image: ${LEDGER_IMAGE:-banking-ledger-api:dev}
    build:
      context: .
      target: runtime
    command: ["python", "-m", "ledger_api.admin.bootstrap"]
    environment:
      <<: *admin-database-url
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:?set LEDGER_OWNER_PASSWORD in .env}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:?set LEDGER_APP_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot, as ledger_owner: applies migrations, then exits (migrations/env.py refuses a
  # superuser). Never done at API startup, where several workers or replicas would race to
  # migrate the same database.
  migrate:
    image: ${LEDGER_IMAGE:-banking-ledger-api:dev}
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *owner-database-url
      APP_ENV: ${APP_ENV:-development}
    volumes:
      # Edited migrations apply without rebuilding the image.
      - ./migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

  # As ledger_app: no admin or owner credential in its environment, and every new database
  # connection is refused if its role turns out to be privileged (data/engine.py).
  api:
    image: ${LEDGER_IMAGE:-banking-ledger-api:dev}
    build:
      context: .
      target: runtime
    environment:
      <<: *app-database-url
      APP_ENV: ${APP_ENV:-development}
      # The rate limits' counters (ADR 0016); no password: reachable on the compose network only.
      REDIS_URL: redis://redis:6379/0
      # Mounted source shadows the installed package so --reload picks up edits.
      PYTHONPATH: /app/src
    command:
      - uvicorn
      - ledger_api.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/src
    volumes:
      - ./src:/app/src:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The test suite's own cluster (`make test`), never the development database: data on tmpfs, so
  # nothing survives the container, and the tests may create the cluster-wide roles migrations
  # grant to. tests/database.py refuses to create a database or role unless all three hold:
  # LEDGER_TEST_CLUSTER=disposable in the test process's environment, the server-side marker
  # ledger.test_cluster=disposable (set by `make test` on this service), and a database with no
  # applied migrations. Profile "test": `make up` does not start it.
  test-db:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # The test suite's own Redis (`make test`, TEST_REDIS_URL), never the development one. Tests
  # only touch keys under a namespace of their own (tests/conftest.py). Profile "test".
  test-redis:
    image: redis:8-alpine
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_TEST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
