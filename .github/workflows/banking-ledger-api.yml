name: banking-ledger-api

on:
  push:
    branches: [main]
    paths:
      - "banking-ledger-api/**"
      - ".github/workflows/banking-ledger-api.yml"
  pull_request:
    paths:
      - "banking-ledger-api/**"
      - ".github/workflows/banking-ledger-api.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: banking-ledger-api

jobs:
  quality:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Integration tests run against real PostgreSQL: the ledger invariants live in triggers and
    # constraints that no in-memory substitute reproduces.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_DB: ledger
          # Throwaway container: trust auth means no password, not even a synthetic one, in git.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ledger@localhost:5432/ledger
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: banking-ledger-api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: banking-ledger-api
          target: runtime
          push: false
          # Loaded under the name compose.yaml uses, so the smoke test runs this exact image.
          load: true
          tags: banking-ledger-api:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image contains the migrations and that db -> migrate -> api start in order.
      - name: Smoke-test the compose stack
        run: |
          cp .env.example .env
          docker compose up --detach --no-build --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes
